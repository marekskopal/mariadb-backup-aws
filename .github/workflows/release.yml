name: Build and publish

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE: marekskopal/mariadb-backup-aws

jobs:
  docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Dependencies are installed at image build time (composer.lock is not committed),
      # so the only way to know the published image works is to run its entrypoint from
      # the built image before pushing. v1.0.0 was published with an entrypoint that died
      # with a PHP fatal error on every invocation.
      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: mariadb-backup-aws:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the entrypoint
        run: |
          docker run --rm --entrypoint php mariadb-backup-aws:smoke /app/bin/console list \
            | grep -q 'mariaDbBackup:aws'
          docker run --rm --entrypoint php mariadb-backup-aws:smoke /app/bin/console mariaDbBackup:aws --help

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
