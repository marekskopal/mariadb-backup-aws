# Integration test environment: a real MariaDB plus MinIO, an S3-compatible server that
# stands in for AWS S3, so the whole backup workflow (dump -> gzip -> upload -> rotate)
# can be exercised end to end without touching a real AWS account.
#
#   docker compose -f docker-compose.test.yml up -d --wait
#   set -a && . ./.env.test && set +a && vendor/bin/phpunit --testsuite integration
#   docker compose -f docker-compose.test.yml down -v

services:
    mariadb:
        image: mariadb:11
        environment:
            MARIADB_ROOT_PASSWORD: root
        ports:
            - '13306:3306'
        healthcheck:
            test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
            interval: 5s
            timeout: 5s
            retries: 20

    minio:
        image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
        command: server /data --console-address ':9001'
        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: minioadmin
            # Enables SSE-S3, so the ServerSideEncryption=AES256 header the uploader
            # sends is honoured here the same way AWS honours it.
            MINIO_KMS_SECRET_KEY: 'mariadb-backup-test-key:bWFyaWFkYi1iYWNrdXAtYXdzLXRlc3Qta2V5LTEyMzQ='
        ports:
            - '19000:9000'
            - '19001:9001'
        healthcheck:
            test: ['CMD', 'mc', 'ready', 'local']
            interval: 5s
            timeout: 5s
            retries: 20
